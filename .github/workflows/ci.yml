name: Frontend CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm api:check
      - run: pnpm api:guard:proof
      - run: pnpm ci:negative-controls
      - run: pnpm build
      - name: Verify Apache metadata and report dependency licenses
        run: |
          grep -Fqx '                                 Apache License' LICENSE
          node -e "const p=require('./package.json'); if (p.license !== 'Apache-2.0') process.exit(1)"
          pnpm licenses list --json > dependency-licenses.json
      - name: Fail on high/critical production dependency advisories
        run: pnpm audit --prod --audit-level=high
      - name: Install Chromium for the independent browser smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production-bundle browser smoke against contract routes
        run: pnpm test:e2e:mock
      - name: Build the production image
        run: docker build --tag odoc-frontend:ci .
      - name: Scan the production image for high/critical dependencies
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: odoc-frontend:ci
          fail-build: true
          severity-cutoff: high
      - name: Retain dependency-license evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dependency-licenses
          path: dependency-licenses.json
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
