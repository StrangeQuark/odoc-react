server {
  listen 8443 ssl;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 26m;
  # Docker Compose returns every replica address for the API service. Resolve
  # it at request time so a frontend container can survive an API replacement
  # or scale-out without being rebuilt/restarted.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $api_upstream api;

  ssl_certificate /etc/nginx/certs/frontend.crt;
  ssl_certificate_key /etc/nginx/certs/frontend.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass https://$api_upstream:8080;
    # Classified uploads/downloads must not be spooled to the proxy filesystem.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/ca/ca.crt;
    proxy_ssl_server_name on;
    proxy_ssl_name api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /runtime-config.json {
    add_header Cache-Control 'no-store' always;
    alias /tmp/odoc-runtime-config.json;
  }

  location ~* \.(?:css|js|woff2?|png|jpe?g|gif|webp|svg)$ {
    add_header Cache-Control 'public, max-age=31536000, immutable' always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control 'no-store' always;
    try_files $uri $uri/ /index.html;
  }
}
